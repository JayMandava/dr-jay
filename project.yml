name: Roastie
options:
  bundleIdPrefix: dev.jeyanth
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  Roastie:
    type: application
    platform: iOS
    sources:
      - path: Roastie
      - path: Shared
    info:
      path: Roastie/Info.plist
      properties:
        CFBundleDisplayName: Dr Jay
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: "Dr Jay checks your sleep from Health so it knows whether to hype you up or roast you."
        NSHealthUpdateUsageDescription: "Dr Jay does not write to Health today, but may ask in future."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [processing, fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - dev.jeyanth.roastie.dailyrefresh
    entitlements:
      path: Roastie/Roastie.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.jeyanth.roastie
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - target: RoastieWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jeyanth.roastie
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  RoastieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RoastieWidgets
      - path: Shared
    info:
      path: RoastieWidgets/Info.plist
      properties:
        CFBundleDisplayName: Dr Jay Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RoastieWidgets/RoastieWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.jeyanth.roastie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jeyanth.roastie.widgets
        SKIP_INSTALL: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  Roastie:
    build:
      targets:
        Roastie: all
        RoastieWidgets: all
    run:
      config: Debug
    archive:
      config: Release
