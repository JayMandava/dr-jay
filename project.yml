name: Roastie
options:
  bundleIdPrefix: dev.jeyanth
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

packages:
  LiteRTLM:
    path: Vendor/LiteRTLM

targets:
  Roastie:
    type: application
    platform: iOS
    sources:
      - path: Roastie
      - path: Shared
      - path: PRIVACY.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
    info:
      path: Roastie/Info.plist
      properties:
        CFBundleDisplayName: Dr Jay
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: "Dr Jay reads your sleep and today's step count from Health for your private daily report."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [processing, fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - dev.jeyanth.roastie.dailyrefresh
    entitlements:
      path: Roastie/Roastie.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.jeyanth.roastie
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - target: RoastieWidgets
        embed: true
      - package: LiteRTLM
        product: LiteRTLM
    postBuildScripts:
      - name: Embed LiteRT privacy manifest
        path: scripts/embed-sdk-privacy.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jeyanth.roastie
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ROASTIE_APP"
        # Framework resource injection requires re-signing nested resources.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  RoastieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RoastieWidgets
      - path: Shared
        excludes:
          - DailyReportGenerator.swift
          - InsightsNarrativeGenerator.swift
    info:
      path: RoastieWidgets/Info.plist
      properties:
        CFBundleDisplayName: Dr Jay Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RoastieWidgets/RoastieWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.jeyanth.roastie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jeyanth.roastie.widgets
        SKIP_INSTALL: YES

  RoastieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoastieTests
    dependencies:
      - target: Roastie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jeyanth.roastie.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Roastie:
    build:
      targets:
        Roastie: all
        RoastieWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoastieTests
    archive:
      config: Release
