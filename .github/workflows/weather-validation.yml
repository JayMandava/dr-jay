name: Weather suggestion validation
on:
  push:
    branches: [fix/actionable-weather-suggestions]
permissions:
  contents: read
jobs:
  ios-tests:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select available iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PYTHON'
          import json, os
          devices = json.load(open('/tmp/devices.json'))['devices']
          candidates = [d for runtime, ds in devices.items() if 'iOS-' in runtime and int(runtime.split('iOS-')[1].split('-')[0]) >= 26 for d in ds if d['name'].startswith('iPhone') and d['isAvailable']]
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PYTHON
      - name: Run native iOS test suite
        run: |
          set -o pipefail
          xcodebuild -project Roastie.xcodeproj -scheme Roastie -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test | tee test.log
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-test-evidence
          path: |
            test.log
            TestResults.xcresult
          retention-days: 7
